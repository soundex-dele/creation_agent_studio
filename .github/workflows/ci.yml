name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creation_studio_test
          POSTGRES_USER: creation_app
          POSTGRES_PASSWORD: creation_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creation_app -d creation_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: backend.settings.testing
      DATABASE_ENGINE: postgresql
      DB_NAME: creation_studio_test
      DB_USER: creation_app
      DB_PASSWORD: creation_app_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_ENABLED: "True"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r requirements/development.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api-types
      - run: git diff --exit-code -- ../contracts/openapi.json src/api/generated.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
