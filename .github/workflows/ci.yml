name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/development.txt
            backend/requirements/production.txt
      - run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r requirements/development.txt -r requirements/production.txt pip-audit
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q
      - run: pip-audit -r requirements/production.txt
      - name: Django production checks
        env:
          DJANGO_SETTINGS_MODULE: backend.settings.production
          SECRET_KEY: ci-only-production-secret-key-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          ALLOWED_HOSTS: studio.example.test
          CORS_ALLOWED_ORIGINS: https://studio.example.test
          DATABASE_ENGINE: sqlite
          SQLITE_PATH: ':memory:'
          APPLICATION_RUNTIME_ALLOW_ALL_PATHS: 'False'
          CREATION_MASTER_ALLOW_ALL_PATHS: 'False'
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -f backend/Dockerfile backend
      - run: docker build -f frontend/Dockerfile .
