name: Application Center

on:
  pull_request:
    paths:
      - "backend/app_center/**"
      - "backend/apps/applications/app_center/**"
      - "backend/backend/settings/**"
      - "frontend/src/lib/applicationCatalog.ts"
      - "frontend/src/stores/useAppStore.ts"
      - ".github/workflows/app-center.yml"
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/development.txt
      - run: python scripts/sync_app_center.py --validate-only
      - run: python -m pytest apps/applications/app_center/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/lib/__tests__/applicationCatalog.test.ts
      - run: npm run build
