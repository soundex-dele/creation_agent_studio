map $http_x_forwarded_proto $creation_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'" always;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / { try_files $uri /index.html; }
  # Remote files use bounded JSON chunks and browser-native streaming downloads.
  location /api/v1/remote/ {
    client_max_body_size 1m;
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  location /api/ {
    client_max_body_size 1024m;
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  location /admin/ {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
  }
  location /static/ {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
  }
  location /_protected_media/ {
    internal;
    alias /data/media/;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /_protected_drive/ {
    internal;
    alias /data/my-drive/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  }
  location = /healthz/ {
    proxy_pass http://web:8080/healthz/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
  }
  location = /readyz/ {
    proxy_pass http://web:8080/readyz/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
  }
  location /ws/ {
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $creation_forwarded_proto;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
  }
}
