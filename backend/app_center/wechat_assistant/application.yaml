api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: wechat-assistant
  version: 1.0.0
  name: 微信助手
  description: 扫码绑定个人微信，与智能体聊天，发送“菜单”管理智能体、会话和任务。
  category:
    slug: productivity
    name: 效率工具
    description: 日常协作与任务工具
    icon: desktop
    order: 30
  icon: message
  color: "#16A34A"
  tags: [微信, 智能体, 个人助手]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: wechat-assistant
    executor_protocol_version: 1
    renderer_key: wechat-assistant
    renderer_schema_version: 1
    retry_policy:
      max_attempts: 1
      retry_safe: false
    input_schema: {type: object}
    output_schema: {type: object}
    default_config: {launch_mode: dedicated}
    dependencies: {agents: [], skills: []}
  backend:
    django_app: app_center.wechat_assistant.backend.apps.WechatAssistantConfig
    urlconf: app_center.wechat_assistant.backend.urls
  database:
    mode: django-migrations
    schema_version: 3
    tenant_scoped: true
  install:
    scope: per-organization
    activate: true
  frontends:
    - id: web
      type: react
      renderer_key: wechat-assistant
      directory: react
      platforms: [web]
