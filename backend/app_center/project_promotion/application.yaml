api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: project-promotion
  version: 1.3.0
  name: 项目宣传助手
  description: 从项目中挖掘多类型事实素材，组合素材策划选题，再到多平台创作、发布和反馈复盘。
  category: {slug: productivity, name: 效率工具, description: 日常协作与任务工具, icon: desktop, order: 30}
  icon: "宣"
  color: "#28746C"
  tags: [宣传, 项目素材, 选题, 内容创作, 发布, 复盘]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: project-promotion
    executor_protocol_version: 1
    renderer_key: project-promotion
    renderer_schema_version: 1
    retry_policy: {max_attempts: 1, retry_safe: false}
    input_schema:
      type: object
      required: [task_id]
      additionalProperties: false
      properties: {task_id: {type: string, format: uuid}}
    output_schema: {type: object}
    default_config:
      launch_mode: dedicated
      brand_reference: {enabled: true, default_modules: [positioning, voice], fields: {}}
    dependencies: {agents: [], skills: []}
  backend:
    django_app: app_center.project_promotion.backend.apps.ProjectPromotionConfig
    urlconf: app_center.project_promotion.backend.urls
    executor_entrypoint: app_center.project_promotion.runtime.execute
  database: {mode: django-migrations, schema_version: 4, tenant_scoped: true}
  install: {scope: per-organization, activate: true}
