api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: my-computer
  version: 1.0.0
  name: 我的电脑
  description: 连接已绑定的电脑，从手机继续本机对话与任务。
  category:
    slug: productivity
    name: 效率工具
    description: 日常协作与任务工具
    icon: desktop
    order: 30
  icon: desktop
  color: "#2563eb"
  tags: [远程访问, 电脑, 对话]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: my-computer
    executor_protocol_version: 1
    renderer_key: my-computer
    renderer_schema_version: 1
    retry_policy:
      max_attempts: 1
      retry_safe: false
    input_schema:
      type: object
    output_schema:
      type: object
    default_config:
      launch_mode: dedicated
    dependencies:
      agents: []
      skills: []
  database:
    mode: none
  install:
    scope: per-organization
    activate: true
