api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: html-to-png
  version: 1.1.0
  name: HTML 批量转 PNG
  description: 选择多个目录，将目录中的 HTML 文件批量渲染为 PNG。
  category:
    slug: image
    name: 图片工具
    order: 25
  icon: "🖼️"
  color: "#7c3aed"
  tags: [HTML, PNG, 批量截图]
  developer: Agent Studio
spec:
  application_kind: task
  launch_mode: run
  definition:
    kind: task
    executor_kind: media
    executor_key: html-to-png
    executor_protocol_version: 1
    renderer_key: html-to-png
    renderer_schema_version: 1
    retry_policy:
      max_attempts: 1
      retry_safe: false
    input_schema:
      type: object
      anyOf:
        - required: [directories]
        - required: [manifest_file]
        - required: [html_file]
      properties:
        manifest_file:
          type: string
          title: HTML 文件清单
          description: 工作流生成的 JSON 清单，files 路径相对于清单所在目录。
        html_file:
          type: string
          title: 单个 HTML 文件
        article_source:
          type: string
          title: 待插图 Markdown 原稿
          description: 根据清单的 insertions 将导出的 PNG 插入正文，另存为 article-with-images.md。
        strict:
          type: boolean
          title: 全部导出成功后继续
          default: false
        directories:
          type: array
          title: HTML 目录
          minItems: 1
          items:
            type: string
        orientation:
          type: string
          enum: [horizontal, vertical]
          default: horizontal
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        device_scale_factor:
          type: number
          minimum: 1
          maximum: 4
          default: 2
        selector:
          type: string
          default: .cover
        full_page:
          type: boolean
          default: false
        transparent:
          type: boolean
          default: false
        no_web_fonts:
          type: boolean
          default: false
        wait_until:
          type: string
          enum: [networkidle, load, domcontentloaded]
          default: networkidle
    output_schema:
      type: object
      properties:
        files: {type: array, items: {type: string}}
        article_md: {type: string}
        total: {type: integer}
        succeeded: {type: integer}
        failed: {type: integer}
    default_config: {}
    dependencies:
      agents: []
      skills: []
  backend:
    executor_entrypoint: app_center.html_to_png.runtime.execute_html_to_png
  database:
    mode: none
  install:
    scope: per-organization
    activate: true
