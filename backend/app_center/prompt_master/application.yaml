api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: prompt-master
  version: 1.0.0
  name: 提示词大师
  description: 从一个想法开始，通过智能追问生成、优化和收藏可直接使用的提示词。
  category: {slug: productivity, name: 效率工具, description: 日常协作与任务工具, icon: desktop, order: 30}
  icon: "词"
  color: "#0F766E"
  tags: [提示词, 智能追问, 写作, 编程, 绘图, 视频]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: prompt-master
    executor_protocol_version: 1
    renderer_key: prompt-master
    renderer_schema_version: 1
    retry_policy: {max_attempts: 1, retry_safe: false}
    input_schema:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: {type: string, format: uuid}
    output_schema: {type: object}
    default_config: {launch_mode: dedicated}
    dependencies: {agents: [], skills: []}
  backend:
    django_app: app_center.prompt_master.backend.apps.PromptMasterConfig
    urlconf: app_center.prompt_master.backend.urls
    executor_entrypoint: app_center.prompt_master.runtime.execute
  database: {mode: django-migrations, schema_version: 1, tenant_scoped: true}
  install: {scope: per-organization, activate: true}
