api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: kitchen-assistant
  version: 2.0.0
  name: 厨房助手
  description: 从今天吃什么到一顿饭上桌，管理菜谱、采购清单、烹饪计时、食材库存和下厨记录。
  category:
    slug: productivity
    name: 效率工具
    description: 日常协作与任务工具
    icon: desktop
    order: 30
  icon: "厨"
  color: "#28704F"
  tags: [厨房, 菜谱, 购物清单, 库存, 计时器]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: kitchen-assistant
    executor_protocol_version: 1
    renderer_key: kitchen-assistant
    renderer_schema_version: 1
    retry_policy: {max_attempts: 1, retry_safe: false}
    input_schema:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: {type: string, format: uuid}
    output_schema: {type: object}
    default_config: {launch_mode: dedicated}
    dependencies: {agents: [], skills: []}
  backend:
    django_app: app_center.kitchen_assistant.backend.apps.KitchenAssistantConfig
    urlconf: app_center.kitchen_assistant.backend.urls
    executor_entrypoint: app_center.kitchen_assistant.runtime.execute
  database:
    mode: django-migrations
    schema_version: 3
    tenant_scoped: true
  install:
    scope: per-organization
    activate: true
