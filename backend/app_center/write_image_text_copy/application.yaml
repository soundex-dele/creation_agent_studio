api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: write-image-text-copy
  version: 1.0.1
  name: 图文文案
  description: 将主题、照片或长文转成图文作品，生成标题、封面短句、逐页文案和发布配文。
  category: {slug: creative, name: 内容创作, description: 文章、文案和创意内容生成, icon: "✍️", order: 1}
  icon: "📝"
  color: "#e85d75"
  tags: [图文文案, 小红书, 多图轮播, 发布配文]
  developer: Agent Studio
spec:
  application_kind: chat
  launch_mode: chat
  definition:
    kind: chat
    executor_kind: agent
    executor_key: agent-chat
    executor_protocol_version: 1
    renderer_key: chat
    renderer_schema_version: 1
    retry_policy: {max_attempts: 3, retry_safe: true}
    input_schema: {}
    output_schema: {}
    default_config:
      guided_entry_prompt_key: write-image-text-copy
      brand_reference:
        enabled: true
        default_modules: [positioning, voice]
        fields: {audience: positioning.audience, requirements: voice}
    chat_profile:
      welcome_message: 填写主题或素材，选择平台与交付范围，预览提示词后开始创作。
      input_placeholder: 继续调整标题、页数、上图文字或发布配文…
      empty_state_title: 创作一组图文文案
      allow_agent_selection: false
      allow_skill_selection: false
      allow_extra_skills: false
      conversation_policy: choose_history
      starter_layout: cards
    agent_bindings:
      - {agent_id: 1, label: 内容创作专家, is_default: true, config_overrides: {}, order: 0}
    skill_bindings:
      - {skill_id: pending-write-image-text-copy, mode: required, config: {}, order: 0}
    guided_prompts:
      - key: write-image-text-copy
        title: 填写图文创作需求
        description: 可创作完整图文，也可只写照片配文、标题或改稿。
        icon: "📝"
        action: preview
        is_featured: true
        order: 0
        prompt_template: |
          请使用 write-image-text-copy Skill 完成下面的图文文案任务。

          交付范围：{task}
          主题、素材、原稿或文件路径：
          {source}

          发布平台：{platform}
          目标读者：{audience}
          页数与图片顺序：{pages}
          语气与补充要求：{requirements}

          用户已通过应用表单确认以上设置，请直接执行，不重复询问已有信息。仅交付所选范围；完整作品默认给推荐标题和 2 个备选、从 P1 封面开始的逐页文案、发布配文。上图文字提供实际换行，并与画面建议分开。页数未指定时按内容组织约 6 页；已有图片和指定页数优先，不为凑页重复内容。指定平台时读取 Skill 的平台适配参考，需要分页或长文拆图时读取分页参考。
          已有图片先读取，再按文件名或原图编号对应；不能读取时说明限制，不声称已看过。不得编造亲测、人物经历、数据或效果承诺。缺少无法合理推断的核心事实时只问必要问题，未定稿明确标为草稿。图片生成、HTML 排版与发布执行不属于本次文案交付。
        questions:
          - key: task
            label: 交付范围
            type: single_choice
            required: true
            default_value: full
            order: 0
            options:
              - {value: full, label: 完整图文作品, description: 标题、封面、逐页文案与发布配文, order: 0}
              - {value: photo-caption, label: 照片配文, order: 1}
              - {value: article-to-pages, label: 长文拆成图文, order: 2}
              - {value: rewrite, label: 优化已有文案, order: 3}
              - {value: titles-cover, label: 仅标题与封面短句, order: 4}
              - {value: topics, label: 选题方向, order: 5}
          - {key: source, label: 主题、素材或原稿, type: text, placeholder: 填写主题、粘贴原稿，或提供工作目录内的图片和文件路径, help_text: 涉及产品体验、价格或数据时，请提供真实资料。, required: true, default_value: null, order: 1}
          - key: platform
            label: 发布平台
            type: single_choice
            required: true
            default_value: general
            order: 2
            options:
              - {value: general, label: 通用图文, order: 0}
              - {value: xiaohongshu, label: 小红书, order: 1}
              - {value: douyin, label: 抖音图文, order: 2}
              - {value: wechat, label: 公众号图文, order: 3}
          - {key: audience, label: 目标读者, type: text, default_value: 与主题匹配的普通读者, required: false, order: 3}
          - {key: pages, label: 页数与图片顺序, type: text, placeholder: 例如：6 页；按原图顺序；只需单图配文, default_value: 按内容决定，完整多图作品约 6 页，已有图片优先, required: false, order: 4}
          - {key: requirements, label: 语气与补充要求, type: text, placeholder: 例如：自然克制；保留作者口吻；只交付成稿, default_value: 自然具体，简体中文, required: false, order: 5}
  backend:
    definition_factory: app_center.write_image_text_copy.provision.prepare_definition
  database: {mode: none}
  install: {scope: per-organization, activate: true}
