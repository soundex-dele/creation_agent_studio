version: '3.8'

services:
  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8080 backend.asgi:application"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5

  execution-worker:
    build: .
    restart: unless-stopped
    command: python manage.py run_execution_coordinator --worker-pool ${EXECUTION_WORKER_POOL:-media}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    command: python manage.py run_automation_scheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:14
    restart: unless-stopped
    container_name: creation_studio_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be configured}
      POSTGRES_USER: ${DB_USER:?DB_USER must be configured}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: creation_studio_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
