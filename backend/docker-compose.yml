services:
  migrate:
    build: .
    restart: "no"
    command: python manage.py migrate --noinput
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy

  app-center-sync:
    build: .
    restart: "no"
    command: python manage.py sync_app_center
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8080 backend.asgi:application
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      REQUIRED_EXECUTION_WORKER_POOLS: agent,media,workflow,evaluation
      REQUIRE_AUTOMATION_SCHEDULER: "true"
      ARTIFACT_ROOT: /data/artifacts
      AGENT_WORKSPACE_ROOT: /data/agent-workspaces
      MEDIA_ROOT: /data/media
      APPLICATION_RUNTIME_ALLOWED_ROOTS: /data
    ports:
      - "8080:8080"
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz/"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-worker:
    build: .
    restart: unless-stopped
    init: true
    command: python manage.py run_execution_coordinator --worker-pool agent
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      ARTIFACT_ROOT: /data/artifacts
      AGENT_WORKSPACE_ROOT: /data/agent-workspaces
      MEDIA_ROOT: /data/media
      APPLICATION_RUNTIME_ALLOWED_ROOTS: /data
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_execution_heartbeat", "--worker-pool", "agent"]
      interval: 15s
      timeout: 5s
      retries: 5

  media-worker:
    build: .
    restart: unless-stopped
    init: true
    command: python manage.py run_execution_coordinator --worker-pool media
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      ARTIFACT_ROOT: /data/artifacts
      AGENT_WORKSPACE_ROOT: /data/agent-workspaces
      MEDIA_ROOT: /data/media
      APPLICATION_RUNTIME_ALLOWED_ROOTS: /data
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_execution_heartbeat", "--worker-pool", "media"]
      interval: 15s
      timeout: 5s
      retries: 5

  workflow-worker:
    build: .
    restart: unless-stopped
    init: true
    command: python manage.py run_execution_coordinator --worker-pool workflow
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      ARTIFACT_ROOT: /data/artifacts
      AGENT_WORKSPACE_ROOT: /data/agent-workspaces
      MEDIA_ROOT: /data/media
      APPLICATION_RUNTIME_ALLOWED_ROOTS: /data
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_execution_heartbeat", "--worker-pool", "workflow"]
      interval: 15s
      timeout: 5s
      retries: 5

  evaluation-worker:
    build: .
    restart: unless-stopped
    init: true
    command: python manage.py run_execution_coordinator --worker-pool evaluation
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      ARTIFACT_ROOT: /data/artifacts
      AGENT_WORKSPACE_ROOT: /data/agent-workspaces
      MEDIA_ROOT: /data/media
      APPLICATION_RUNTIME_ALLOWED_ROOTS: /data
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_execution_heartbeat", "--worker-pool", "evaluation"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build: .
    restart: unless-stopped
    command: python manage.py run_automation_scheduler
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_execution_heartbeat", "--scheduler"]
      interval: 30s
      timeout: 5s
      retries: 5

  maintenance:
    build: .
    restart: unless-stopped
    command: python manage.py enforce_retention --loop --poll-interval 3600
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      ARTIFACT_ROOT: /data/artifacts
      AGENT_WORKSPACE_ROOT: /data/agent-workspaces
      MEDIA_ROOT: /data/media
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-center-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_execution_heartbeat", "--maintenance"]
      interval: 60s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: creation_studio_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be configured}
      APP_DB_NAME: ${DB_NAME:?DB_NAME must be configured}
      APP_DB_USER: ${DB_USER:?DB_USER must be configured}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-db.sh:/docker-entrypoint-initdb.d/10-app-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    container_name: creation_studio_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  runtime_data:
    driver: local
