<!doctype html><html lang="zh-CN"><head><title>网页提取测试</title><meta name="author" content="示例作者"><meta property="article:published_time" content="2026-10-16"><link rel="canonical" href="/article"></head><body><nav>首页 登录 帮助</nav><main><article><h1>网页提取测试</h1><p>这是一篇用于测试正文提取的中文文章。正文应当保留，而导航和广告不应成为文章内容。文章描述了如何把公开网页中的内容转换成可以复用的结构化资料。</p><p>保存文章时需要尊重原始结构，包括段落、列表、引用、表格和代码块。图片保持来源链接，避免不必要的资源下载。作者和发布时间存在时应当准确保留。</p><h2>步骤</h2><ol><li>打开网页</li><li>提取正文</li></ol><blockquote>保留原文信息。</blockquote><table><thead><tr><th>项目</th><th>值</th></tr></thead><tbody><tr><td>格式</td><td>Markdown</td></tr></tbody></table><pre><code class="language-python">print("你好")</code></pre><img data-src="/cover.png" alt="封面"><p><a href="/related">相关阅读</a></p><p>这段文字提供额外的文章上下文，用于确保通用正文识别器不会把内容视为页面导航。所有测试仅使用本地固定样本，不依赖网络响应。</p></article></main><footer>隐私政策</footer></body></html>
