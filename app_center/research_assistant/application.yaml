api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: research-assistant
  version: 1.0.0
  name: 资料研究助手
  description: 汇集 PDF、Word 与文章，生成带出处的研究报告、观点对照和写作资料包。
  category: {slug: productivity, name: 效率工具, description: 日常协作与任务工具, icon: desktop, order: 30}
  icon: "研"
  color: "#2563EB"
  tags: [资料研究, 研究报告, 观点对照, 原文溯源]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: research-assistant
    executor_protocol_version: 1
    renderer_key: research-assistant
    renderer_schema_version: 1
    retry_policy: {max_attempts: 1, retry_safe: false}
    input_schema:
      type: object
      required: [research_project_id, result_id]
      additionalProperties: false
      properties:
        research_project_id: {type: string, format: uuid}
        result_id: {type: string, format: uuid}
    output_schema: {type: object}
    default_config: {launch_mode: dedicated}
    dependencies: {agents: [], skills: []}
  backend:
    django_app: app_center.research_assistant.backend.apps.ResearchAssistantConfig
    urlconf: app_center.research_assistant.backend.urls
    executor_entrypoint: app_center.research_assistant.runtime.execute
  database: {mode: django-migrations, schema_version: 1, tenant_scoped: true}
  install: {scope: per-organization, activate: true}
