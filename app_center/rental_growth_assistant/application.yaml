api_version: agent-studio/v1
kind: ApplicationPackage
metadata:
  id: rental-growth-assistant
  version: 1.0.2
  name: 租房获客助手
  description: 从房源、内容到咨询、带看与成交，串起个人租房中介的日常运营。
  category: {slug: productivity, name: 效率工具, description: 日常协作与任务工具, icon: desktop, order: 30}
  icon: "房"
  color: "#28746C"
  tags: [租房, 获客, 小红书, 内容运营, 客户跟进]
  developer: Agent Studio
spec:
  application_kind: custom
  launch_mode: dedicated
  definition:
    kind: custom
    executor_kind: media
    executor_key: rental-growth-assistant
    executor_protocol_version: 1
    renderer_key: rental-growth-assistant
    renderer_schema_version: 1
    retry_policy: {max_attempts: 1, retry_safe: false}
    input_schema:
      type: object
      required: [task_id]
      additionalProperties: false
      properties: {task_id: {type: string, format: uuid}}
    output_schema: {type: object}
    default_config: {launch_mode: dedicated}
    dependencies: {agents: [], skills: []}
  backend:
    django_app: app_center.rental_growth_assistant.backend.apps.RentalGrowthConfig
    urlconf: app_center.rental_growth_assistant.backend.urls
    executor_entrypoint: app_center.rental_growth_assistant.runtime.execute
  database: {mode: django-migrations, schema_version: 2, tenant_scoped: true}
  install: {scope: per-organization, activate: true}
